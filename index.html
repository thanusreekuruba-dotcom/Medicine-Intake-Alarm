<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicine Intake Alarm</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN PAGE -->
    <div class="login-container" id="loginPage">

        <div class="login-box">

            <div class="login-icon">💊</div>

            <h1>Medicine Alarm</h1>

            <p>Login to manage your medicine reminders</p>

            <label for="email">Email ID</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <button id="loginBtn">
                🔐 Login
            </button>

            <p id="loginMessage"></p>

        </div>

    </div>


    <!-- MEDICINE ALARM PAGE -->
    <div class="container" id="medicinePage">

        <div class="top-bar">

            <div>
                <h1>💊 Medicine Alarm</h1>
                <p id="userEmail"></p>
            </div>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>

        </div>

        <p class="subtitle">
            Never miss your medicine
        </p>


        <div class="form-box">

            <label for="medicine">
                Medicine Name
            </label>

            <input
                type="text"
                id="medicine"
                placeholder="Example: Vitamin D"
            >


            <label for="date">
                Date
            </label>

            <input
                type="date"
                id="date"
            >


            <label for="time">
                Time
            </label>

            <input
                type="time"
                id="time"
            >


            <button id="setReminderBtn">
                🔔 Set Medicine Reminder
            </button>

        </div>


        <p id="message"></p>


        <div class="reminders-section">

            <h2>📋 My Reminders</h2>

            <div id="reminderList">
                <p class="empty">
                    No reminders added yet.
                </p>
            </div>

        </div>

    </div>


    <!-- Alarm Sound -->
    <audio id="alarmSound">

        <source
            src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
            type="audio/ogg"
        >

    </audio>


    <script src="script.js"></script>

</body>
</html>
